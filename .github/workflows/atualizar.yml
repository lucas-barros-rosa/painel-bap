# Atualiza os dados do painel e publica no Cloudflare Pages.
# Roda sozinho às segundas e quintas e também pode ser disparado à mão (aba Actions > "Run workflow").
name: Atualizar painel

on:
  push:                            # roda sozinho quando chegam ao GitHub:
    branches: [main]
    paths:
      - "pipeline/entrada/nivel_*.csv"   # o nível do rio enviado pelo seu computador (05:30)
      - "pipeline/*.py"                  # mudanças no código do pipeline
      - "pipeline/requirements.txt"
      - "site/**"                        # mudanças no site
      - ".github/workflows/**"
  schedule:
    # reserva, caso o computador esteja desligado: segundas e quintas, 10:47 UTC (06:47 em Cuiabá).
    # Fora da hora cheia, quando o GitHub mais atrasa ou descarta execuções agendadas.
    - cron: "47 10 * * 1,4"
  workflow_dispatch:               # botão "Run workflow"

concurrency:
  group: painel                    # nunca duas execuções ao mesmo tempo
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 340           # o GitHub permite até 6 h por execução
    steps:
      - name: Copiar o código do repositório
        uses: actions/checkout@v4

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Instalar bibliotecas
        run: pip install -r pipeline/requirements.txt

      - name: Recuperar os dados já baixados (cache)
        uses: actions/cache/restore@v4
        with:
          path: pipeline/cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Baixar e calcular
        working-directory: pipeline
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}   # chave gratuita da NASA FIRMS (focos de calor)
          TEMPO_MAX_MIN: "300"     # para de baixar depois de 5 h e continua na próxima execução
        run: python atualizar_dados.py

      - name: Guardar os dados baixados (cache)
        if: always()
        uses: actions/cache/save@v4
        with:
          path: pipeline/cache
          key: dados-${{ github.run_id }}

      - name: Publicar no Cloudflare Pages
        if: hashFiles('pipeline/.completo') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy site --project-name="${{ vars.CLOUDFLARE_PROJETO }}" --branch=main --commit-dirty=true
